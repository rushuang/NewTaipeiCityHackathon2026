                techList: [

                    { name: "開發相對枯燥", desc: "核心工作是寫大量規則檢核與 OCR 欄位對齊，技術展現較受限" },
                    { name: "故事性較弱", desc: "屬於政府內部後台工具，難以像 YouBike 或幼兒園題那樣引發大眾共鳴" }

                techList: [
                    { name: "行銷企劃與分析大展身手", desc: "組員 3 可以給出非常有智慧城市高度的青年政策提案" },
                    { name: "高強度的 ETL 數據清洗", desc: "需要將中央、地方等不同標準定義的青年數據整合並標準化" },
                    { name: "數據交叉關聯與分析", desc: "尋找青年教育程度與起薪等跨領域之潛在關聯" }

                metrics: { complexity: 90, impact: 80, aws: 75 }
            },
            // DECK 2 - Slide 7 (Suitability 5)
            {
                type: "content",
                rank: "❌ 適合度 Top 5",
                topic: "YouBike 智慧調度 (交通局)",
                suitability: "適合度：⭐⭐☆☆☆ (最不建議 - 技術錯位)",
                why: "技術棧與你們團隊嚴重錯位。這題需要高深的『時間序列預測模型（LSTM/DeepAR）』與『運籌調度路線優化演算法（如遺傳演算法）』。雖然組員 4 能刻出漂亮的調度地圖，但你們缺乏專攻傳統機器學習時序與最佳化運籌的隊員，硬碰硬等於用己之短（時序預測）攻彼之長（統計系/傳統 ML 隊伍），且無法發揮組員 1 在 NLP 與組員 3 在商業故事包裝上的優勢。",
                techList: [
                    { name: "技術嚴重錯位", desc: "極度硬核的時序大數據預測 + 地理空間資訊 (GIS) + 運籌優化" },
                    { name: "競爭慘烈", desc: "YouBike 調度是近年大數據競賽老調重彈的經典題，極難做出新意" },
                    { name: "組員價值浪費", desc: "完全無法發揮團隊在 NLP、大語言模型 Agent 與商業企劃的強大優勢" }
                ],
                metrics: { complexity: 95, impact: 80, aws: 80 }
            }
        ];

        const decks = { 1: deck1, 2: deck2 };
        let currentDeck = 1;
        let currentSlide = 0;

        // 指南控制
        function closeGuide() {
            document.getElementById('guide-overlay').classList.add('guide-hidden');
        }

        function openGuide() {
            document.getElementById('guide-overlay').classList.remove('guide-hidden');
        }

        // 切換簡報集
        function switchDeck(deckNum) {
            currentDeck = deckNum;
            currentSlide = 0;
            
            // 更新 Tab 樣式
            const tab1 = document.getElementById("deck-tab-1");
            const tab2 = document.getElementById("deck-tab-2");
            
            if(deckNum === 1) {
                tab1.className = "px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all duration-300 bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md";
                tab2.className = "px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all duration-300 text-gray-400 hover:text-white";
            } else {
                tab2.className = "px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all duration-300 bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md";
                tab1.className = "px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all duration-300 text-gray-400 hover:text-white";
            }
            
            renderSlide();
        }

        // 翻頁邏輯
        function nextSlide() {
            if (currentSlide < decks[currentDeck].length - 1) {
                currentSlide++;
                animateSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                animateSlide();
            }
        }

        function animateSlide() {
            const wrapper = document.getElementById("slide-wrapper");
            wrapper.classList.remove("slide-active");
            wrapper.classList.add("slide-enter");
            
            setTimeout(() => {
                renderSlide();
                wrapper.classList.remove("slide-enter");
                wrapper.classList.add("slide-active");
            }, 150);
        }

        // 💡 效益評分轉換星星數標準輔助函式
        function renderStars(score) {
            let starsHTML = '';
            // 計算滿星、半星及空星數量
            if (score >= 95) {
                starsHTML = `
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <span class="text-amber-400 font-bold ml-1">5.0</span>
                `;
            } else if (score >= 85) { // 85 與 90 分皆屬同梯隊高分表現，對應 4.5 顆星
                starsHTML = `
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star-half-stroke text-amber-400"></i>
                    <span class="text-amber-400 font-bold ml-1">4.5</span>
                `;
            } else if (score >= 80) {
                starsHTML = `
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-regular fa-star text-zinc-600"></i>
                    <span class="text-amber-400 font-bold ml-1">4.0</span>
                `;
            } else if (score >= 75) {
                starsHTML = `
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star-half-stroke text-amber-400"></i>
                    <i class="fa-regular fa-star text-zinc-600"></i>
                    <span class="text-amber-400 font-bold ml-1">3.5</span>
                `;
            } else {
                starsHTML = `
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <i class="fa-solid fa-star-half-stroke text-amber-400"></i>
                    <i class="fa-regular fa-star text-zinc-600"></i>
                    <i class="fa-regular fa-star text-zinc-600"></i>
                    <span class="text-amber-400 font-bold ml-1">2.5</span>
                `;
            }
            return `<div class="flex items-center space-x-1 text-sm">${starsHTML}</div>`;
        }

        // 渲染主功能
        function renderSlide() {
            const slide = decks[currentDeck][currentSlide];
            const contentContainer = document.getElementById("slide-content");
            
            // 更新計數器與進度條
            document.getElementById("current-slide-num").innerText = currentSlide + 1;
            document.getElementById("total-slides-num").innerText = decks[currentDeck].length;
            const progressPct = ((currentSlide + 1) / decks[currentDeck].length) * 100;
            document.getElementById("slide-progress").style.width = `${progressPct}%`;

            let htmlContent = "";

            if (slide.type === "title") {
                htmlContent = `
                    <div class="flex-grow flex flex-col justify-center items-center text-center py-8">
                        <span class="px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 mb-6 tracking-wide uppercase font-mono">${slide.badge}</span>
                        <div class="bg-gradient-to-br from-indigo-500 to-violet-600 p-5 rounded-3xl text-white shadow-xl mb-6 shadow-indigo-950/40 animate-pulse">
                            <i class="fa-solid ${slide.icon} text-4xl"></i>
                        </div>
                        <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-zinc-200 to-zinc-400 mb-4">${slide.title}</h2>
                        <h3 class="text-xl md:text-2xl text-indigo-300 font-medium mb-4">${slide.subtitle}</h3>
                        <p class="max-w-2xl text-sm md:text-base text-gray-400 leading-relaxed font-sans">${slide.desc}</p>
                    </div>
                `;
            } else if (slide.type === "content") {
                htmlContent = `
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 h-full">
                        <div class="lg:col-span-7 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center space-x-3 mb-3">
                                    <span class="px-3 py-1 rounded-md text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${slide.rank}</span>
                                    <span class="text-xs md:text-sm text-emerald-400 font-medium">${slide.suitability}</span>
                                </div>
                                <h2 class="text-2xl md:text-3xl font-bold text-white tracking-wide mb-4">${slide.topic}</h2>
                                <div class="bg-zinc-900/40 border border-zinc-800/60 rounded-2xl p-4 md:p-5 mb-4 shadow-inner">
                                    <p class="text-xs font-bold uppercase tracking-wider text-indigo-400 mb-2 font-mono"><i class="fa-solid fa-brain mr-1.5"></i>戰略價值評估</p>
                                    <p class="text-sm text-gray-300 leading-relaxed font-sans">${slide.why}</p>
                                </div>
                            </div>

                            <div>
                                <p class="text-xs font-bold uppercase tracking-wider text-violet-400 mb-2 font-mono"><i class="fa-solid fa-cubes mr-1.5"></i>核心解決方案與技術組件</p>
                                <div class="space-y-2">
                                    ${slide.techList.map((tech, idx) => `
                                        <div class="flex items-start space-x-3 bg-zinc-900/20 hover:bg-zinc-900/40 p-2.5 rounded-xl border border-zinc-900 transition-colors">
                                            <span class="text-xs font-mono font-bold bg-zinc-800 text-zinc-400 w-5 h-5 rounded flex items-center justify-center mt-0.5">${idx+1}</span>
                                            <div>
                                                <p class="text-xs font-bold text-zinc-200">${tech.name}</p>
                                                <p class="text-xs text-gray-400">${tech.desc}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <div class="lg:col-span-5 flex flex-col justify-between bg-zinc-900/30 border border-zinc-800/80 rounded-2xl p-6 shadow-xl">
                            <div>
                                <p class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-6 font-mono"><i class="fa-solid fa-chart-simple-inverted mr-1.5"></i>效益指標量化對比</p>
                                
                                <div class="space-y-6">
                                    <div>
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="text-xs md:text-sm font-semibold text-zinc-300 flex items-center"><i class="fa-solid fa-gears mr-2 text-indigo-400 w-4"></i>技術複雜度 (Complexity)</span>
                                        </div>
                                        ${renderStars(slide.metrics.complexity)}
                                    </div>

                                    <div>
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="text-xs md:text-sm font-semibold text-zinc-300 flex items-center"><i class="fa-solid fa-bullseye mr-2 text-rose-400 w-4"></i>預期影響力 (Impact)</span>
                                        </div>
                                        ${renderStars(slide.metrics.impact)}
                                    </div>

                                    <div>
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="text-xs md:text-sm font-semibold text-zinc-300 flex items-center"><i class="fa-brands fa-aws mr-2 text-amber-500 w-4"></i>AWS 技術結合度 (AWS)</span>
                                        </div>
                                        ${renderStars(slide.metrics.aws)}
                                    </div>
                                </div>
                            </div>

                            <div class="pt-4 border-t border-zinc-800/80 flex items-center justify-between text-xs text-gray-500 font-mono">
                                <span>智慧數據 & 智慧治理</span>
                                <span>2026 Hackathon</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (slide.type === "team") {
                htmlContent = `
                    <div class="h-full flex flex-col justify-between">
                        <div class="border-b border-zinc-800 pb-4 mb-4">
                            <h2 class="text-2xl md:text-3xl font-bold text-white tracking-wide"><i class="fa-solid fa-users text-indigo-400 mr-3"></i>${slide.title}</h2>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow my-2">
                            ${slide.members.map(m => `
                                <div class="glassmorphism p-4 rounded-xl border border-zinc-800 hover:border-indigo-500/20 transition-all duration-300 flex flex-col justify-between">
                                    <div class="flex justify-between items-center mb-2">
                                        <h4 class="text-sm font-bold text-zinc-100">${m.role}</h4>
                                        <span class="px-2 py-0.5 bg-indigo-500/20 text-indigo-300 text-[10px] font-bold rounded font-mono">${m.tag}</span>
                                    </div>
                                    <p class="text-xs text-gray-400 leading-relaxed font-sans flex-grow">${m.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                        <div class="text-xs text-zinc-500 font-mono pt-2 border-t border-zinc-900">戰略配置：揚長避短，最大化 Prototype 產出速度與故事共鳴度</div>
                    </div>
                `;
            } else if (slide.type === "summary") {
                htmlContent = `
                    <div class="h-full flex flex-col justify-between">
                        <div class="border-b border-zinc-800 pb-3 mb-4">
                            <h2 class="text-2xl md:text-3xl font-bold text-white tracking-wide"><i class="fa-solid fa-layer-group text-violet-400 mr-3"></i>${slide.title}</h2>
                        </div>
                        <div class="space-y-4 flex-grow justify-center flex flex-col">
                            ${slide.points.map(t => `
                                <div class="flex items-start space-x-4 bg-zinc-900/30 p-4 rounded-2xl border border-zinc-800/60">
                                    <div class="bg-indigo-500/10 p-2.5 rounded-xl text-indigo-400 mt-0.5"><i class="fa-solid fa-check text-sm"></i></div>
                                    <div>
                                        <h4 class="text-base font-bold text-zinc-200 mb-1">${t.title}</h4>
                                        <p class="text-xs md:text-sm text-gray-400 leading-relaxed font-sans">${t.text}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            contentContainer.innerHTML = htmlContent;
        }

        // 鍵盤導覽
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight' || event.key === ' ') {
                nextSlide();
            } else if (event.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        // 觸控手勢支援
        let touchstartX = 0;
        let touchendX = 0;
        
        const slideWrapper = document.getElementById('slide-wrapper');
        
        slideWrapper.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        });

        slideWrapper.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleGesture();
        });

        function handleGesture() {
            if (touchendX < touchstartX - 50) {
                nextSlide(); // 向左滑，下一張
            }
            if (touchendX > touchstartX + 50) {
                prevSlide(); // 向右滑，上一張
            }
        }

        // 初始化首張投影片
        window.onload = function() {
            renderSlide();
        };
    </script>
</body>
</html>
