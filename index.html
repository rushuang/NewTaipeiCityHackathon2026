                        { title: "組員 3 (企劃) 🚀 領跑痛點分析", text: "競賽前 12 小時，完成精緻的 PPT 架構，定義出完美的社會與行政痛點。隨後協助技術團隊搜集輔助數據（如特定輿情、新聞）。" },
                        { title: "組員 2 (智囊) 📝 定義規則與邏輯", text: "迅速將新北市政府的出題說明，拆解成 AI 可執行的邏輯判斷（IF-THEN / Agent Workflow），成為技術與商業端的堅實橋梁。" },
                        { title: "組員 1 & 4 (技術) 💻 極速實現 Prototype", text: "組員 1 專攻 AWS Bedrock 接口、Prompt 設計與 Agent 反覆思考鏈；組員 4 藉 Claude Code 提效，火速搭建出有地圖與警示燈的動態網頁 MVP。" }
                    ],
                    badge: "新北市黑客松勝利方程式"
                }
            ]
        };

        // Switch Slide Deck logic
        function switchDeck(deckNum) {
            currentDeck = deckNum;
            currentSlide = 0;
            
            // UI tabs updates
            document.getElementById("deck-tab-1").className = deckNum === 1 
                ? "px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all duration-300 bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md"
                : "px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all duration-300 text-gray-400 hover:text-white";
            document.getElementById("deck-tab-2").className = deckNum === 2 
                ? "px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all duration-300 bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md"
                : "px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all duration-300 text-gray-400 hover:text-white";

            renderSlide();
        }

        function nextSlide() {
            if (currentSlide < decks[currentDeck].length - 1) {
                currentSlide++;
                animateSlideTransition();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                animateSlideTransition();
            }
        }

        function animateSlideTransition() {
            const el = document.getElementById("slide-wrapper");
            el.classList.remove("slide-active");
            el.classList.add("slide-enter");
            setTimeout(() => {
                renderSlide();
                el.classList.remove("slide-enter");
                el.classList.add("slide-active");
            }, 150);
        }

        // Main Renderer for slide slides
        function renderSlide() {
            const slide = decks[currentDeck][currentSlide];
            const contentContainer = document.getElementById("slide-content");
            
            // Update slide counts
            document.getElementById("current-slide-num").innerText = currentSlide + 1;
            document.getElementById("total-slides-num").innerText = decks[currentDeck].length;
            const progressPct = ((currentSlide + 1) / decks[currentDeck].length) * 100;
            document.getElementById("slide-progress").style.width = `${progressPct}%`;

            let htmlContent = "";

            if (slide.type === "title") {
                htmlContent = `
                    <div class="flex-grow flex flex-col justify-center items-center text-center py-8">
                        <span class="px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 mb-6 tracking-wide uppercase font-mono">${slide.badge}</span>
                        <div class="bg-gradient-to-br from-indigo-500 to-violet-600 p-5 rounded-3xl text-white shadow-xl mb-6 shadow-indigo-950/40 animate-pulse">
                            <i class="fa-solid ${slide.icon} text-4xl"></i>
                        </div>
                        <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-zinc-200 to-zinc-400 mb-4">${slide.title}</h2>
                        <h3 class="text-xl md:text-2xl text-indigo-300 font-medium mb-6">${slide.subtitle}</h3>
                        <p class="text-sm md:text-base text-gray-400 max-w-xl font-medium leading-relaxed">${slide.desc}</p>
                    </div>
                `;
            } else if (slide.type === "content") {
                htmlContent = `
                    <div class="h-full flex flex-col justify-between">
                        <!-- Top Row: Title, badge and rank -->
                        <div class="flex flex-wrap items-center justify-between border-b border-zinc-800/80 pb-4 mb-4">
                            <div class="flex items-center space-x-3">
                                <span class="px-3.5 py-1.5 rounded-xl text-sm font-bold bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-md shadow-orange-950/20">${slide.rank}</span>
                                <h3 class="text-lg md:text-2xl font-bold text-white">${slide.topic}</h3>
                            </div>
                            <span class="text-xs md:text-sm font-semibold px-3 py-1 bg-zinc-800 text-indigo-300 rounded-lg border border-zinc-700/80 my-2 lg:my-0">${slide.suitability}</span>
                        </div>

                        <!-- Main Content split in 2 columns -->
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start flex-grow my-2">
                            <!-- Left Column: Why this space & Strategy -->
                            <div class="lg:col-span-7 space-y-4">
                                <div class="bg-zinc-900/60 p-5 rounded-2xl border border-zinc-800/80">
                                    <h4 class="text-indigo-400 font-bold text-sm mb-2 uppercase tracking-wide flex items-center">
                                        <i class="fa-solid fa-lightbulb mr-2 text-indigo-500"></i>為什麼要選這題？ (黑客松視角)
                                    </h4>
                                    <p class="text-sm md:text-base text-gray-300 leading-relaxed font-medium">${slide.why}</p>
                                </div>
                                <div class="bg-zinc-900/40 p-5 rounded-2xl border border-zinc-800/50">
                                    <h4 class="text-violet-400 font-bold text-sm mb-3 uppercase tracking-wide flex items-center">
                                        <i class="fa-solid fa-gears mr-2 text-violet-500"></i>核心所需技術與技術棧
                                    </h4>
                                    <ul class="space-y-3">
                                        ${slide.techList.map(t => `
                                            <li class="flex items-start text-xs md:text-sm">
                                                <span class="text-indigo-400 mr-2 mt-0.5"><i class="fa-solid fa-circle-dot text-[8px]"></i></span>
                                                <div>
                                                    <strong class="text-zinc-200 font-bold block">${t.name}</strong>
                                                    <span class="text-gray-400 text-xs">${t.desc}</span>
                                                </div>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>

                            <!-- Right Column: Dashboard Radar Metrics -->
                            <div class="lg:col-span-5 bg-zinc-900/80 p-6 rounded-2xl border border-zinc-800/80 space-y-5">
                                <h4 class="text-zinc-300 font-bold text-sm uppercase tracking-wide flex items-center">
                                    <i class="fa-solid fa-chart-simple mr-2 text-zinc-400"></i>主題難易與效益指標
                                </h4>
                                <!-- Complexity Metric -->
                                <div class="space-y-2">
                                    <div class="flex justify-between text-xs font-mono">
                                        <span class="text-gray-400 font-semibold">技術複雜度 (難度)</span>
                                        <span class="text-zinc-300 font-bold">${slide.metrics.complexity}%</span>
                                    </div>
                                    <div class="bg-zinc-800 h-2 rounded-full overflow-hidden">
                                        <div class="bg-gradient-to-r from-indigo-500 to-indigo-400 h-full" style="width: ${slide.metrics.complexity}%"></div>
                                    </div>
                                </div>
                                <!-- Impact Metric -->
                                <div class="space-y-2">
                                    <div class="flex justify-between text-xs font-mono">
                                        <span class="text-gray-400 font-semibold">評審Demo吸睛度 (效益)</span>
                                        <span class="text-zinc-300 font-bold">${slide.metrics.impact}%</span>
                                    </div>
                                    <div class="bg-zinc-800 h-2 rounded-full overflow-hidden">
                                        <div class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full" style="width: ${slide.metrics.impact}%"></div>
                                    </div>
                                </div>
                                <!-- AWS Integration -->
                                <div class="space-y-2">
                                    <div class="flex justify-between text-xs font-mono">
                                        <span class="text-gray-400 font-semibold">AWS 資源整合容易度</span>
                                        <span class="text-zinc-300 font-bold">${slide.metrics.aws}%</span>
                                    </div>
                                    <div class="bg-zinc-800 h-2 rounded-full overflow-hidden">
                                        <div class="bg-gradient-to-r from-violet-500 to-fuchsia-400 h-full" style="width: ${slide.metrics.aws}%"></div>
                                    </div>
                                </div>

                                <div class="pt-4 border-t border-zinc-800/80 flex items-center justify-between text-xs text-gray-500 font-mono">
                                    <span>智慧數據 & 智慧治理</span>
                                    <span>2026 Hackathon</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (slide.type === "team") {
                htmlContent = `
                    <div class="h-full flex flex-col justify-between">
                        <div class="border-b border-zinc-800 pb-4 mb-4">
                            <h3 class="text-2xl font-bold text-white flex items-center">
                                <i class="fa-solid fa-users-viewfinder mr-3 text-indigo-500"></i>${slide.title}
                            </h3>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow my-2">
                            ${slide.members.map(m => `
                                <div class="bg-zinc-900/60 p-4 rounded-xl border border-zinc-800/80 flex flex-col justify-between hover:border-indigo-500/40 transition-all duration-300 group">
                                    <div>
                                        <div class="flex items-center justify-between mb-2">
                                            <strong class="text-base text-white font-bold">${m.role}</strong>
                                            <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-indigo-500/10 border border-indigo-500/20 text-indigo-400">${m.tag}</span>
                                        </div>
                                        <p class="text-xs md:text-sm text-gray-400 leading-relaxed font-medium">${m.desc}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (slide.type === "summary") {
                htmlContent = `
                    <div class="h-full flex flex-col justify-between">
                        <div class="flex items-center justify-between border-b border-zinc-800 pb-4 mb-4">
                            <h3 class="text-2xl font-bold text-white">${slide.title}</h3>
                            <span class="px-3 py-1 rounded-lg text-xs font-bold bg-violet-500/10 border border-violet-500/20 text-violet-300 font-mono">${slide.badge}</span>
                        </div>
                        <p class="text-sm md:text-base text-gray-400 mb-6 font-medium">${slide.desc}</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow mb-4">
                            ${slide.tips.map((t, index) => `
                                <div class="bg-zinc-900/60 p-5 rounded-2xl border border-zinc-800/80 flex flex-col justify-between">
                                    <div>
                                        <div class="flex items-center space-x-3 mb-3">
                                            <span class="flex items-center justify-center w-7 h-7 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 font-mono text-sm font-bold">0${index+1}</span>
                                            <h4 class="text-sm md:text-base font-bold text-zinc-100">${t.title}</h4>
                                        </div>
                                        <p class="text-xs md:text-sm text-gray-400 leading-relaxed font-medium">${t.text}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            contentContainer.innerHTML = htmlContent;
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight' || event.key === ' ') {
                nextSlide();
            } else if (event.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        // Touch (Swipe) Gestures support
        let touchstartX = 0;
        let touchendX = 0;
        
        const slideWrapper = document.getElementById('slide-wrapper');
        
        slideWrapper.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        });

        slideWrapper.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleGesture();
        });

        function handleGesture() {
            if (touchendX < touchstartX - 50) {
                nextSlide(); // Swiped left, go next
            }
            if (touchendX > touchstartX + 50) {
                prevSlide(); // Swiped right, go previous
            }
        }

        // Initialize first slide on load
        window.onload = function() {
            renderSlide();
        };
    </script>
</body>
</html>
